---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: write_best_hpam
description: |
  Without hyperparameter tuning, there is only one hyperparameter combination. This native Nextflow process
  writes it as the best combination, in the format of evaluate_find_max, so that no CV training is needed.
keywords:
  - hyperparameters
  - no-tuning
  - yaml
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - model_name:
        type: string
        description: Name of the model.
    - test_mode:
        type: string
        description: Specifies the test mode. One of LPO, LCO, LTO, LDO.
    - split_id:
        type: string
        description: Cross-validation split, e.g., "split_0", or "final" for the final model.
    - hpam_yaml:
        type: file
        description: The only hyperparameter configuration of the model.
        pattern: "*.yaml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML

output:
  best_combis:
    - - model_name:
          type: string
          description: See input.
      - split_id:
          type: string
          description: See input.
      - test_mode:
          type: string
          description: See input.
      - "best_hpam_combi_*.yaml":
          type: file
          description: |
            Yaml containing the hyperparameter combination. Structure:
            "{model_name}_{split_id}": {"best_hpam_combi": best_hpam_combi}
          pattern: "best_hpam_combi_*.yaml"
          ontologies:
            - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
