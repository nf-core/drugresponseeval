---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: randomization_test
description: |
  Makes a randomization experiment for a specified model with the determined optimal
  hyperparameter configuration.
keywords:
  - randomization
  - ablation
  - machine learning
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - model_name:
        type: string
        description: Name of the model.
    - test_mode:
        type: string
        description: Test mode, i.e., LPO, LCO, LTO, or LDO.
    - split_id:
        type: string
        description: specified cross-validation fold. One model per fold.
    - split_dataset:
        type: file
        description: Pickled split.
        pattern: "*pkl"
    - best_hpams:
        type: file
        description: yaml of the optimal hyperparameter configuration.
        pattern: "*yaml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
    - randomization_views:
        type: file
        description: Definition of the randomization experiment.
        pattern: "*.yaml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
    - path_data:
        type: file
        description: Path to the data directory. Used to load cell line/drug feature data.
  - randomization_type:
      type: string
      description: Randomization type (permutation, invariant).
  - response_transformation:
      type: string
      description: Either None or a specified transformation that should be applied to the response.
  - model_checkpoint_dir:
      type: string
      description: Either TEMPORARY or a directory where model checkpoints should be saved.

output:
  ch_vis:
    - - test_mode:
          type: string
          description: See input.
      - model_name:
          type: string
          description: See input.
      - "*/randomization/randomization*.csv":
          type: file
          description: |
            All predicted values for the specified dataset for the randomization.
          pattern: "*/randomization/randomization*.csv"
  per_drug:
    - "*/drugs/**.csv":
        type: file
        description: |
          Single drug models only: the predictions per drug, in <model_name>/drugs/<drug_id>/.
          The consolidated predictions over all drugs are in the other outputs.
        pattern: "*/drugs/**.csv"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_drevalpy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - drevalpy:
          type: string
          description: The name of the tool
      - "drevalpy --version | sed 's/drevalpy //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_sklearn:
    - - ${task.process}:
          type: string
          description: The name of the process
      - sklearn:
          type: string
          description: The name of the tool
      - 'python -c "import sklearn; print(sklearn.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - numpy:
          type: string
          description: The name of the tool
      - 'python -c "import numpy; print(numpy.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - 'python -c "import pandas; print(pandas.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_pytorch_lightning:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pytorch_lightning:
          type: string
          description: The name of the tool
      - 'python -c "import pytorch_lightning; print(pytorch_lightning.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_torch:
    - - ${task.process}:
          type: string
          description: The name of the process
      - torch:
          type: string
          description: The name of the tool
      - 'python -c "import torch; print(torch.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
