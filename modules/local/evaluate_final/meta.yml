---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: evaluate_final
description: Evaluates the predictions from the final model
keywords:
  - evaluation
  - performance
  - predictions
  - final model
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - test_mode:
        type: string
        description: Specifies the test mode. One of LPO, LCO, LTO, LDO.
    - model_name:
        type: string
        description: Name of the model. Used to find out whether the model is a single-drug model.
    - pred_file:
        type: file
        description: File containing the true and predicted drug responses that this final trained model produced.

output:
  ch_individual_results:
    - "*.csv":
        type: file
        description: |
          Contains the individual result evaluation files per model: {model_name}_evaluation_results.csv,
          {model_name}_evaluation_results_per_drug.csv, {model_name}_evaluation_results_per_cl.csv, and
          {model_name}_true_vs_pred.csv.
        pattern: "*.csv"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_drevalpy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - drevalpy:
          type: string
          description: The name of the tool
      - "drevalpy --version | sed 's/drevalpy //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - 'python -c "import pandas; print(pandas.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_sklearn:
    - - ${task.process}:
          type: string
          description: The name of the process
      - sklearn:
          type: string
          description: The name of the tool
      - 'python -c "import sklearn; print(sklearn.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - numpy:
          type: string
          description: The name of the tool
      - 'python -c "import numpy; print(numpy.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_scipy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - scipy:
          type: string
          description: The name of the tool
      - 'python -c "import scipy; print(scipy.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
