---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: visualize_results
description: Makes the interactive HTML results plots and files.
keywords:
  - visualization
  - interactive
  - html
  - results
  - exploration
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - eval_results:
        type: file
        description: Global evaluation results.
        pattern: "*csv"
    - eval_results_per_drug:
        type: file
        description: Evaluation results per drug.
        pattern: "*csv"
    - eval_results_per_cl:
        type: file
        description: Evaluation results per cell line.
        pattern: "*csv"
    - true_vs_predicted:
        type: file
        description: True vs. predicted values.
        pattern: "*csv"
  - path_data:
      type: string
      description: Path to the data.

output:
  html_out:
    - "report/*":
        type: file
        description: Folder containing all report-related files.
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
containers:
  conda:
    linux/amd64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-a2b7a0d499377204_1/condalock
    linux/arm64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-c0ad67ba4f34e1c5_1/condalock
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_pip_drevalpy:a2b7a0d499377204
      build_id: bd-a2b7a0d499377204_1
    linux/arm64:
      name: community.wave.seqera.io/library/python_pip_drevalpy:c0ad67ba4f34e1c5
      build_id: bd-c0ad67ba4f34e1c5_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/python_pip_drevalpy:9f89d6d50658553e
      build_id: bd-9f89d6d50658553e_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/88/88d06bd843a342074e5def5c95e7d993cfe4a7f0acb7c41eb6c00e78d9ce8654/data
    linux/arm64:
      name: oras://community.wave.seqera.io/library/python_pip_drevalpy:1f164cef478f17cc
      build_id: bd-1f164cef478f17cc_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/3e/3ecc057132a723d9c2b97bec20727e0b83999fddc02842832efd7193a4690e30/data
