---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: visualize_results
description: Makes the interactive HTML results plots and files.
keywords:
  - visualization
  - interactive
  - html
  - results
  - exploration
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - eval_results:
        type: file
        description: Global evaluation results.
        pattern: "*csv"
    - eval_results_per_drug:
        type: file
        description: Evaluation results per drug.
        pattern: "*csv"
    - eval_results_per_cl:
        type: file
        description: Evaluation results per cell line.
        pattern: "*csv"
    - true_vs_predicted:
        type: file
        description: True vs. predicted values.
        pattern: "*csv"
  - path_data:
      type: string
      description: Path to the data.

output:
  html_out:
    - "report/*":
        type: file
        description: Folder containing all report-related files.
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
containers:
  conda:
    linux/amd64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-4ca8e30ab27649ab_1/condalock
    linux/arm64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-d6def7fa2145d0f6_1/condalock
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/matplotlib_numpy_pandas_python_pruned:4ca8e30ab27649ab
      build_id: bd-4ca8e30ab27649ab_1
    linux/arm64:
      name: community.wave.seqera.io/library/matplotlib_numpy_pandas_python_pruned:d6def7fa2145d0f6
      build_id: bd-d6def7fa2145d0f6_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/matplotlib_numpy_pandas_python_pruned:54314124d6599bfc
      build_id: bd-54314124d6599bfc_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/a5/a589391212c7f5bdb805ac3e01d7609bbe0acc5b3e6321d2ecf3034c045f0ea2/data
    linux/arm64:
      name: oras://community.wave.seqera.io/library/matplotlib_numpy_pandas_python_pruned:fd698882595ef0f9
      build_id: bd-fd698882595ef0f9_1
