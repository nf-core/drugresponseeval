---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: tune_final_model
description: Trains the final model on the collapsed dataset to find the optimal hyperparameter configuration.
keywords:
  - tuning
  - future predictions
  - machine learning
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - model_name:
        type: string
        description: Name of the model.
    - train_ds:
        type: file
        description: Training data obtained from final split, pickled.
        pattern: "*pkl"
    - val_ds:
        type: file
        description: Validation data obtained from final split, pickled.
        pattern: "*pkl"
    - early_stop_ds:
        type: file
        description: Optional early stopping data obtained from final split, pickled.
        pattern: "*pkl"
    - test_mode:
        type: string
        description: Specifies the test mode. One of LPO, LCO, LTO, LDO.
    - path_data:
        type: file
        description: Path to the data for loading cell line and drug features.
    - hpam_combi:
        type: file
        description: Hyperparameter configuration on which this model will now be trained.
        pattern: "*yaml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
  - response_transformation:
      type: string
      description: Either None or a specified transformation that should be applied to the response.
  - model_checkpoint_dir:
      type: string
      description: Either TEMPORARY or a directory where model checkpoints should be saved.

output:
  final_prediction:
    - model_name:
        type: string
        description: see input.
    - test_mode:
        type: string
        description: see input.
    - "final":
        type: string
        description: identifier to indicate that this is the final model.
    - hpam_combi:
        type: file
        description: see input.
    - "final_prediction_dataset_*.pkl":
        type: file
        description: Final predictions used to evaluate best-performing hyperparameter configuration.
        pattern: "final_prediction_dataset_*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
