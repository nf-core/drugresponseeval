name: postprocess_curvecurator_data
description: Module to make the output of the CurveCurator call fitting for
  drevalpy.
keywords:
  - collection
  - results
  - single-drug
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - dataset_name:
      type: string
      description: Name of the dataset processed by CurveCurator.
  - curve_data:
      type: file
      description: All curves.tsv files outputted by CurveCurator.
      pattern: "*.tsv"
  - measure:
      type: string
      description: Response measure selected for this drevalpy run. Will then get
        updated to {measure}_curvecurator.

output:
  path_to_dataset:
    - "${dataset_name}.csv":
        type: file
        description: The new, reprocessed drug response dataset. Will get saved to
          path_data.
        pattern: "*.csv"
  measure:
    - "measure_curvecurator":
        type: string
        description: Updated measure, now has _curvecurator appended.
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_pip_drevalpy:af9bf54ab78b9680
      buildId: bd-af9bf54ab78b9680_2
      scanId: sc-b6d2bf0ab809292d_1
    linux/arm64:
      name: community.wave.seqera.io/library/python_pip_drevalpy:c833eff049957dc2
      buildId: bd-c833eff049957dc2_1
      scanId: sc-4f679c779337d3be_1
  singularity:
