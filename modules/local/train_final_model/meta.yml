---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: train_final_model
description: Trains a final model on the collapsed dataset and saves it for predicting future datasets.
keywords:
  - training
  - future predictions
  - machine learning
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - model_name:
        type: string
        description: Name of the model.
    - test_mode:
        type: string
        description: Specifies the test mode. One of LPO, LCO, LTO, LDO.
    - best_hpam_combi:
        type: file
        description: Best hyperparameter configuration on which this model will now be trained.
        pattern: "*yaml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
    - train_data:
        type: file
        description: Training data obtained from final split, pickled.
        pattern: "*pkl"
    - val_data:
        type: file
        description: Validation data obtained from final split, pickled.
        pattern: "*pkl"
    - early_stop_data:
        type: file
        description: Optional early stopping data obtained from final split, pickled.
        pattern: "*pkl"
    - path_data:
        type: file
        description: Path to the data for loading cell line and drug features.
  - response_transformation:
      type: string
      description: Either None or a specified transformation that should be applied to the response.
  - model_checkpoint_dir:
      type: string
      description: Either TEMPORARY or a directory where model checkpoints should be saved.

output:
  final_model:
    - "**final_model/*":
        type: file
        description: Folder with final saved model and its configurations required for loading it.
        pattern: "**final_model/*"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
containers:
  conda:
    linux/amd64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-4ca8e30ab27649ab_1/condalock
    linux/arm64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-d6def7fa2145d0f6_1/condalock
  docker:
