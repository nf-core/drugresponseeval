---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: fit_curves
description: Fits curves using CurveCurator.
keywords:
  - curve fitting
  - dose-response data
  - harmonization
tools:
  - curve_curator:
      description: |
        CurveCurator is an open-source analysis platform for dose-dependent data sets. It fits a classical
        4-parameter equation to estimate effect potency, effect size, and the statistical significance
        of the observed response.
      homepage: https://github.com/kusterlab/curve_curator
      documentation: https://github.com/kusterlab/curve_curator
      tool_dev_url: https://github.com/kusterlab/curve_curator
      doi: "10.1038/s41467-023-43696-z"
      licence: ["Apache-2.9"]
      identifier: ""

input:
  - dataset_name:
      type: string
      description: Name of the dataset, e.g., CTRPv2
  - - dir_name:
        type: string
        description: Directory name where the toml file lies.
    - toml:
        type: file
        description: TOML file specifying the parameters for CurveCurator.
        pattern: "config.toml"
    - curvecurator_input:
        type: file
        description: Contains the input to CurveCurator, i.e., samples, drugs, doses, replicates
        pattern: "curvecurator_input.tsv"

output:
  path_to_curvecurator_out:
    - "curves.tsv":
        type: file
        description: |
          Contains fitted curves.
        pattern: "curves.tsv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
containers:
  conda:
    linux/amd64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-a2b7a0d499377204_1/condalock
    linux/arm64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-c0ad67ba4f34e1c5_1/condalock
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_pip_drevalpy:a2b7a0d499377204
      build_id: bd-a2b7a0d499377204_1
    linux/arm64:
      name: community.wave.seqera.io/library/python_pip_drevalpy:c0ad67ba4f34e1c5
      build_id: bd-c0ad67ba4f34e1c5_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/python_pip_drevalpy:9f89d6d50658553e
      build_id: bd-9f89d6d50658553e_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/88/88d06bd843a342074e5def5c95e7d993cfe4a7f0acb7c41eb6c00e78d9ce8654/data
    linux/arm64:
