---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: fit_curves
description: Fits curves using CurveCurator.
keywords:
  - curve fitting
  - dose-response data
  - harmonization
tools:
  - curve_curator:
      description: |
        CurveCurator is an open-source analysis platform for dose-dependent data sets. It fits a classical
        4-parameter equation to estimate effect potency, effect size, and the statistical significance
        of the observed response.
      homepage: https://github.com/kusterlab/curve_curator
      documentation: https://github.com/kusterlab/curve_curator
      tool_dev_url: https://github.com/kusterlab/curve_curator
      doi: "10.1038/s41467-023-43696-z"
      licence: ["Apache-2.9"]
      identifier: ""

input:
  - dataset_name:
      type: string
      description: Name of the dataset, e.g., CTRPv2
  - - dir_name:
        type: string
        description: Directory name where the toml file lies.
    - toml:
        type: file
        description: TOML file specifying the parameters for CurveCurator.
        pattern: "config.toml"
    - curvecurator_input:
        type: file
        description: Contains the input to CurveCurator, i.e., samples, drugs, doses, replicates
        pattern: "curvecurator_input.tsv"

output:
  path_to_curvecurator_out:
    - "curves.tsv":
        type: file
        description: |
          Contains fitted curves.
        pattern: "curves.tsv"
  versions_curve_curator:
    - - ${task.process}:
          type: string
          description: The name of the process
      - curve_curator:
          type: string
          description: The name of the tool
      - 'python -c "import curve_curator; print(curve_curator.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - curve_curator:
          type: string
          description: The name of the tool
      - 'python -c "import curve_curator; print(curve_curator.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
containers:
  conda:
    linux/amd64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-2d99d1f3c69513fe_1/condalock
    linux/arm64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-777f8328b6e0fc50_1/condalock
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_pip_curve_curator:2d99d1f3c69513fe
      build_id: bd-2d99d1f3c69513fe_1
    linux/arm64:
      name: community.wave.seqera.io/library/python_pip_curve_curator:777f8328b6e0fc50
      build_id: bd-777f8328b6e0fc50_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/python_pip_curve_curator:2718d9f1018755f9
      build_id: bd-2718d9f1018755f9_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/42/42f7c00ddbe6320c0c19b1206beec7949b6d46440020c0d7a0fa93e7717e6284/data
    linux/arm64:
      name: oras://community.wave.seqera.io/library/python_pip_curve_curator:ab8e2f018d9340dd
      build_id: bd-ab8e2f018d9340dd_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/45/4592ab2f41b6416d6ecab43144fc8920ba4913f6e294c77d3a067e815829c5e4/data
