---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: evaluate_find_max
description: |
  Evaluates the results of all cross-validation splits to find
  the best-performing hyperparameter combination.
keywords:
  - collection
  - results
  - single-drug
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - model_name:
        type: string
        description: Name of the model. Used to find out whether the model is a single-drug model.
    - test_mode:
        type: string
        description: Specifies the test mode. One of LPO, LCO, LTO, LDO.
    - split_id:
        type: string
        description: Cross-validation split being evaluated, e.g., "split_0".
    - hpam_yamls:
        type: file
        description: Contain the individual hyperparameter configurations.
        pattern: "*.yaml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
    - pred_datas:
        type: file
        description: |
          Pickled DrugResponseDataset containing the true and predicted drug responses for the models in their
          hyperparameter configurations. Used to evaluate the performance of each hyperparameter configuration
          to identify the best one.
  - metric:
      type: string
      description: |
        Hyperparameter optimization metric used to evaluate the performance
        (e.g., MSE, RMSE, MAE, R^2, Pearson).

output:
  best_combis:
    - - model_name:
          type: string
          description: See input.
      - split_id:
          type: string
          description: See input.
      - test_mode:
          type: string
          description: See input.
      - "best_hpam_combi_*.yaml":
          type: file
          description: |
            Yaml containing the best hyperparameter combination. Structure:
            "{model_name}_{split_id}": {"best_hpam_combi": best_hpam_combi, "best_result": best_result}
          pattern: "best_hpam_combi_*.yaml"
          ontologies:
            - edam: http://edamontology.org/format_3750 # YAML
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_drevalpy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - drevalpy:
          type: string
          description: The name of the tool
      - "drevalpy --version | sed 's/drevalpy //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - 'python -c "import pandas; print(pandas.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_sklearn:
    - - ${task.process}:
          type: string
          description: The name of the process
      - sklearn:
          type: string
          description: The name of the tool
      - 'python -c "import sklearn; print(sklearn.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - numpy:
          type: string
          description: The name of the tool
      - 'python -c "import numpy; print(numpy.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_scipy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - scipy:
          type: string
          description: The name of the tool
      - 'python -c "import scipy; print(scipy.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_yaml:
    - - ${task.process}:
          type: string
          description: The name of the process
      - yaml:
          type: string
          description: The name of the tool
      - 'python -c "import yaml; print(yaml.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
