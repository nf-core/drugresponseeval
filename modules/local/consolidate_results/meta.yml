---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: consolidate_results
description: Consolidate results
keywords:
  - collection
  - results
  - single-drug
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - test_mode:
        type: string
        description: Specifies the test mode. One of LPO, LCO, LTO, LDO.
    - model_name:
        type: string
        description: Name of the model. Used to find out whether the model is a single-drug model.
  - rand_modes:
      type: string
      description: |
        Either "[None]" if no randomization modes were selected or list of randomization modes.
        Allowed values: None or combinations of SVRC, SVRD, SVCC, SVCD.
  - nr_files:
      type: integer
      description: |
        How many files are contained in the channel ch_vis. Dummy to make the process wait until
        all results are generated.

output:
  ch_vis:
    - - test_mode:
          type: string
          description: See input.
      - model_name:
          type: string
          description: See input.
      - "**split*.csv":
          type: file
          description: |
            Consolidated file for the single-drug models containing all predictions, all cross-study
            predictions, all robustness test, and all randomization test predictions.
          pattern: "**split*.csv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
