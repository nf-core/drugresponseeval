---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: cv_split
description: Splits the input dataset into cross-validation folds.
keywords:
  - cross-validation
  - data split
  - machine learning
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - - test_mode:
        type: string
        description: Specifies the test mode. One of LPO, LCO, LTO, LDO.
    - response:
        type: file
        description: Path to the pickled file containing the DrugResponseDataset (the whole drug response data).
  - n_cv_splits:
      type: integer
      description: |
        Number of cross-validation splits to be created.

output:
  response_cv_split:
    - - test_mode:
          type: string
          description: See input.
      - "split*.pkl":
          type: file
          description: |
            Pickled datasets of the cross-validation splits.
          pattern: "split*.pkl"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
containers:
  conda:
    linux/amd64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-a2b7a0d499377204_1/condalock
    linux/arm64:
      lock_file: https://wave.seqera.io/v1alpha1/builds/bd-c0ad67ba4f34e1c5_1/condalock
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_pip_drevalpy:a2b7a0d499377204
      build_id: bd-a2b7a0d499377204_1
    linux/arm64:
      name: community.wave.seqera.io/library/python_pip_drevalpy:c0ad67ba4f34e1c5
      build_id: bd-c0ad67ba4f34e1c5_1
  singularity:
    linux/amd64:
