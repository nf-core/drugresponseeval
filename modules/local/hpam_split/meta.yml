name: hpam_split
description: Make one yaml file per hyperparameter configuration for the
  specified model.
keywords:
  - hyperparameters
  - optimization
  - configuration
tools:
  - drevalpy:
      description: |
        drevalpy is the package underlying nf-core/drugresponseeval. It provides a framework for fair and
        coherent training and evaluation of monotherapy drug response prediction models.
      homepage: https://github.com/daisybio/drevalpy/
      documentation: https://drevalpy.readthedocs.io/en/latest/index.html
      tool_dev_url: https://github.com/daisybio/drevalpy/
      doi: "10.1101/2025.05.26.655288"
      licence: ["MIT"]
      identifier: ""

input:
  - model_name:
      type: string
      description: Name of the model.
  - no_hyperparameter_tuning:
      type: boolean
      description: When true, then only one (the first) hyperparameter
        configuration is emitted.

output:
  hpam_combi:
    - - model_name:
          type: string
          description: See input.
      - "*yaml":
          type: file
          description: Hyperparameter configurations.
          pattern: "*.yaml"
          ontologies:
            - edam: http://edamontology.org/format_3750 # YAML
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
