# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "MODEL_TESTING"
description: |
  Subworkflow after identification of the optimal hyperparameter configurations. Used for training a final model
  per CV split, randomization tests, robustness tests, and training a final model on the whole dataset for future
  predictions of unseen datasets.
keywords:
  - train
  - predict
  - randomization
  - ablation
  - robustness
  - final model
components:
  - predict/full
  - randomization/split
  - randomization/test
  - robustness/test
  - final/split
  - tune/final/model
  - evaluate/find/max
  - write/best/hpam
  - train/final/model
  - evaluate/final
  - collect/results
  - visualize/results
input:
  - best_hpam_per_split:
      type: list
      description: |
        Channel containing the best hyperparameters per split in the form
        [split_id, test_mode, split_dataset, model_name, best_hpam_combi_X.yaml]
  - randomizations:
      type: string
      description: List of randomizations
  - response_dataset:
      type: file
      description: Pickled dataset containing the response data.
  - cross_study_datasets:
      type: list
      description: List of pickled datasets containing the pickled cross-study datasets.
  - ch_models:
      type: list
      description: Channel containing the model names (used for randomization, ...)
  - work_path:
      type: file
      description: path to the data, emitted once the meta information is available
  - test_modes:
      type: list
      description: e.g., LPO, LCO
  - ch_hpam_combis:
      type: list
      description: channel containing the optimal hyperparameter combinations [model_name, hpam_X.yaml]
  - cross_study_dataset_names:
      type: string
      description: Comma-separated names of cross-study datasets, empty string if none
  - randomization_mode:
      type: string
      description: Comma-separated randomization modes, e.g., SVRC, or None
  - randomization_type:
      type: string
      description: Randomization type, e.g., permutation or invariant
  - n_trials_robustness:
      type: integer
      description: Number of robustness test trials, 0 to disable
  - final_model_on_full_data:
      type: boolean
      description: If true, train a final model on the full dataset
  - no_hyperparameter_tuning:
      type: boolean
      description: If true, use only the first hyperparameter combination without tuning
  - response_transformation:
      type: string
      description: Response transformation, e.g., standard, minmax, robust, or None
  - model_checkpoint_dir:
      type: string
      description: Directory for model checkpoints
  - optim_metric:
      type: string
      description: Metric used to select the best hyperparameter combination, e.g., RMSE
output:
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
