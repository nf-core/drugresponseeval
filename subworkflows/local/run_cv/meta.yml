# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "RUN_CV"
description: |
  Subworkflow for identifying the optimal hyperparameter configurations of each model via cross-validation.
keywords:
  - train
  - predict
  - cross-validation
  - hyperparameter optimization
components:
  - unzip
  - load/response
  - cv/split
  - hpam/split
  - train/and/predict/cv
  - evaluate/find/max
input:
  - test_modes:
      type: list
      description: e.g., LPO, LCO
  - ch_models:
      type: list
      description: Channel containing the model names (used for randomization, ...)
  - ch_baselines:
      type: list
      description: Channel containing the baseline names (used for comparison)
  - work_path:
      type: file
      description: path to the data channel.fromPath(params.path_data)
  - measure:
      type: string
      description: Response measure of choice.
  - path_data:
      type: string
      description: Path to the data directory
  - dataset_name:
      type: string
      description: Name of the response dataset
  - zenodo_link:
      type: string
      description: Base URL from which missing datasets are downloaded
  - cross_study_dataset_names:
      type: string
      description: Comma-separated names of cross-study datasets, empty string if none
  - clean_min_responders:
      type: integer
      description: Minimum number of responders per drug, empty to disable
  - clean_min_responder_frac:
      type: number
      description: Minimum fraction of responders per drug, empty to disable
  - custom_splitter_path:
      type: string
      description: Path to a custom CV splitter, empty to use the default
  - n_cv_splits:
      type: integer
      description: Number of cross-validation splits
  - no_hyperparameter_tuning:
      type: boolean
      description: If true, use only the first hyperparameter combination without tuning
  - response_transformation:
      type: string
      description: Response transformation, e.g., standard, minmax, robust, or None
  - model_checkpoint_dir:
      type: string
      description: Directory for model checkpoints
  - optim_metric:
      type: string
      description: Metric used to select the best hyperparameter combination, e.g., RMSE
output:
  - best_hpam_per_split:
      type: list
      description: |
        Channel containing the best hyperparameters per split in the form
        [split_id, test_mode, split_dataset, model_name, best_hpam_combi_X.yaml]
  - response_dataset:
      type: file
      description: Pickled dataset containing the response data.
  - cross_study_datasets:
      type: list
      description: List of pickled datasets containing the pickled cross-study datasets.
  - ch_hpam_combis:
      type: list
      description: channel containing the optimal hyperparameter combinations [model_name, hpam_X.yaml]
  - work_path:
      type: file
      description: path to the data, emitted only once the meta information is available in it
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@JudithBernett"
maintainers:
  - "@JudithBernett"
